[project]
name = "final-extra-2026"
version = "0.1.0"
description = "Final extra exam 2026-27."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pillow>=10.0",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.3.1",
    "complexipy>=5.4.1",
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[[tool.mypy.overrides]]
module = [
    "torchvision.*",
    "tqdm.*"
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
ignore = ["E203", "W503"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov src"

[tool.coverage.run]
omit = ["src/main.py"]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
